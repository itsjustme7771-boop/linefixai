# Supabase local dev config — https://supabase.com/docs/guides/cli/config
project_id = "linefixai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.diagnose]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false